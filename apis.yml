  - type: Features
    data:
      - name: Ceiling Systems
        description: >-
          Extensive portfolio of suspended acoustic ceiling systems including
          mineral fiber, fiberglass, wood, metal, and specialty tile products for
          commercial and residential applications.
      - name: Wall Solutions
        description: >-
          Architectural wall system products including felt, wood, metal, and
          specialty panel systems for interior design and acoustic performance.
      - name: BIM Content Library
        description: >-
          Revit families and BIM content for Armstrong ceiling and wall products
          available for download by architects and designers for building
          information modeling workflows.
      - name: Product Specification Tools
        description: >-
          Online product selector and specification tools allowing architects to
          configure ceiling systems and generate specifications and submittal documents.
      - name: PROJECTWORKS Service
        description: >-
          Customized 3D model and visualization service for complex ceiling projects,
          providing detailed installation drawings and visualization for contractors.
  - type: UseCases
    data:
      - name: Commercial Construction Specification
        description: >-
          Architects and designers specify Armstrong ceiling and wall systems for
          commercial office, education, healthcare, and hospitality projects using
          product selectors and specification tools.
      - name: BIM Modeling
        description: >-
          Building professionals download Revit families and BIM content to model
          Armstrong ceiling systems accurately in building information models.
      - name: Acoustic Design
        description: >-
          Specify ceiling and wall products optimized for noise reduction and
          acoustic performance in open-plan offices, classrooms, and healthcare facilities.
