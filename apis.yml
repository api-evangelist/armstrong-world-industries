aid: armstrong-world-industries
name: Armstrong World Industries
description: >-
  Armstrong World Industries (NYSE: AWI) is a leading global designer and
  manufacturer of innovative commercial and residential ceiling, wall, and
  suspension system solutions. Armstrong offers a broad portfolio of ceiling and
  wall products across mineral fiber, fiberglass, wood, metal, and specialty
  substrates for use in commercial construction and renovation projects worldwide.
  The company provides BIM content, product data, and specification tools for
  architects and designers but does not offer a public developer API.
